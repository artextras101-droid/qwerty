name: Secure 24-7 Minecraft Bot

on:
  workflow_dispatch: # Manual start button
  schedule:
    - cron: '0 */4 * * *' # Automatically restarts every 4 hours forever

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Project Files
      uses: actions/checkout@v4

    - name: Install Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Mineflayer Dependency
      run: npm install mineflayer

    - name: Write Bot Script
      run: |
        cat << 'EOF' > index.js
        const mineflayer = require('mineflayer');

        const bot = mineflayer.createBot({
          host: 'mergesmo.play.hosting', // <-- Your custom Aternos IP
          port: 25631,                 // <-- Your custom Port 
          username: 'GitHub_AFK_Bot',   
          version: '1.20.1'            // <-- Change this if your server is on a different version!
        });

        bot.on('login', () => {
          console.log(`[SUCCESS] Bot logged into MERGESMO.aternos.me!`);
        });

        bot.on('spawn', () => {
          console.log(`[SPAWN] Bot has spawned safely in the world.`);
        });

        // SILENT HEARTBEAT: Keeps the bot online without suspicious looping movements
        setInterval(() => {
          console.log("[HEARTBEAT] Connection is stable and active.");
        }, 30000);

        // PLAYER CONTROLS (Type these in game chat to interact)
        bot.on('chat', (username, message) => {
          if (username === bot.username) return;
          
          if (message === '!jump') {
            bot.setControlState('jump', true);
            setTimeout(() => bot.setControlState('jump', false), 500);
          }
          
          if (message === '!come') {
            const playerFilter = (entity) => entity.type === 'player' && entity.username === username;
            const playerEntity = bot.nearestEntity(playerFilter);
            if (playerEntity) {
              bot.lookAt(playerEntity.position.offset(0, playerEntity.height, 0));
            }
          }
        });

        bot.on('kicked', (reason) => {
          console.log(`[KICKED] Reason: ${reason}`);
        });

        bot.on('error', (err) => {
          console.log(`[ERROR] Connection error: ${err}`);
        });
        EOF

    - name: Activate Bot Terminal Environment
      run: node index.js
