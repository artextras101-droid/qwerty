name: Activate My Minecraft Bot

on:
  workflow_dispatch: # This adds the button to turn it on

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Packages
      run: npm install

    - name: Turn Bot On
      run: node index.js
